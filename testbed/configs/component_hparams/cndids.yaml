# CND-IDS 원 논문 근거 (CND-IDS/FeatureExtractors/CND_IDS.py)
# 서브에이전트 조사로 파일:라인까지 대조 완료 (testbed/docs/metric_justification.md 참고)

lambda_r: 0.1
# CND_IDS.py:43 "self.reg_strength" — reconstruction loss 가중치.
# L_CND = L_CS(metric/triplet, 가중치 1 암묵) + lambda_r * L_R(recon MSE)
#         + lambda_cl * L_CL(LwF/continual MSE)   (CND_IDS.py:161-166)

lambda_cl: 0.1
# CND_IDS.py:45 "self.LwF_strength" — 이 테스트베드의 PRD가 정의하는 "L_CL"
# (연속학습/증류 손실) 가중치로 대응시켰다. CND-IDS 코드에서는 과거 태스크
# encoder 출력과의 MSE(LwFloss, CND_IDS.py:54-69)로 구현되어 있다.

triplet_margin: 2.0
# CND_IDS.py:76-78 TripletMarginLoss(margin=2), semihard mining(TripletMarginMiner)
# — 정상(0)/신규(1) pseudo-label 클러스터 간 거리 학습에 사용.

cluster_fit_sample_size: 10000
# 2026-08-11 추가 — 원 논문에는 없는 이 테스트베드 고유의 성능 최적화
# 하이퍼파라미터(GPM의 activation_sample_size와 동일한 성격). K-means
# 클러스터 후보를 원 논문 리스트([100,300,500,1000,2000], 데이터셋 무관
# 고정)로 되돌리면서, CICIDS2018처럼 라운드당 선택 데이터가 수십만 건인
# 경우 K=2000 fit을 experience당 7회(elbow 6+최종 1) 반복하는 비용이
# 감당 불가능해진다. 데이터가 이 값보다 크면 무작위 부분표본에서만
# fit하고(중심점만 찾으면 됨), 실제 pseudo-label 배정은 이미 검증된 GPU
# 벡터화 predict로 전체 데이터에 적용한다. 합성 데이터(N=240,000, 80차원)
# 로컬 벤치마크 실측: cap=10,000일 때 K=2000 elbow+최종fit 전체가 라운드당
# 약 150초(5 experience 기준 콤보당 약 12.5분) — cap=20,000이면 약 277초
# (콤보당 약 23분)로 늘어난다.
#
# **2026-08-26 정정(재감사에서 발견) — 아래 "NSL-KDD/UNSW-NB15는 이 값보다
# 작다"는 서술은 더 이상 사실이 아니다**: Track B가 label_budget 없이
# experience 전체를 쓰도록 바뀐 뒤(2026-08-05, 이 파일의 다른 주석 참고)
# 라운드당 실제 표본 수는 NSL-KDD 13,468~59,396건, UNSW-NB15 11,200~
# 130,541건으로, **둘 다 이제 매 라운드 10,000을 넘어 부분표본 경로가
# 항상 발동한다**(예전엔 라벨 예산(~10%) 적용 후라 작았다). 결과 품질에
# 문제를 일으킨다는 증거는 없지만(K-Means predict는 어차피 전체 데이터에
# 적용됨, fit만 부분표본), 이 주석이 실제 동작과 다르게 "발동 안 함"이라고
# 서술하고 있었다는 것만 정정한다. 이 값 자체는 원 논문 근거가 없는 순수
# 엔지니어링 절충이므로, 결과 품질이 나빠지면(A/B로 확인,
# docs/metric_justification.md 참고) 조정 대상이다.

max_normal_ref: 5000
# 원문 근거 없음 — 이 테스트베드 고유의 보정 장치(2026-08-26 도입).
# `on_experience_start`가 "어떤 클러스터가 정상인가"를 판정할 때 쓰는
# 정상 참조 풀의 누적 상한. 원문의 `datastream.init_normal`은 스트림 시작
# 전 한 번 확정되는 고정 참조라 이런 캡이 필요 없지만, 이 테스트베드는
# `normal_subset`이 매 라운드 그 라운드 자신의 라벨 구성에서 새로 나오므로
# (공격이 희귀한 라운드는 거의 라운드 전체가 "정상"), 누적하되 무한정
# 커지지 않도록 캡을 둔다. 자세한 경위는
# `components/cndids/cndids_anti_forgetting.py` 모듈 docstring
# "2026-08-26" 절과 `docs/metric_justification.md` 참고.

latent_dim: 30
# CND_IDS.py:13 기본 latent 차원 (encoder: nInput→128→256→128→latent).
# 단, 이 테스트베드는 10.1절에 따라 공유 백본의 latent_dim(2026-08-11부터
# SSF 공식으로 데이터셋마다 계산 — global_hparams.yaml 참고)을 모든 조합에
# 동일 적용하므로, 이 값은 실제로는 그 계산값으로 덮어써진다(참고용 기록).

elbow_n_jobs: 1
# 원문 근거 없음 — 이 테스트베드 고유의 성능 최적화(2026-09-04 추가).
# _elbow_kmeans_fit()의 K 후보(최대 5개, 서로 완전히 독립적인 계산)를
# joblib.Parallel로 동시에 fit한다. 1(기본값)이면 지금까지와 완전히 동일한
# 순차 루프다. 값을 키워도 elbow가 선택하는 K 자체(optimal_k)는 순차
# 실행과 동일함을 실측 확인했지만, 최종 KMeans의 cluster_centers_ 좌표는
# elbow_n_jobs 값과 무관하게(1끼리 비교해도) 실행마다 미세하게 달라질 수
# 있다 — sklearn KMeans 자체의 기존 비결정성(멀티스레드 Lloyd 알고리즘의
# 부동소수점 합산 순서 문제로 추정)이지 이 병렬화가 새로 만드는 문제가
# 아니다(cndids_anti_forgetting.py `_fit_one_candidate` "2026-09-04 정정"
# 절 참고).
#
# 이 값을 grid_runner.py/smoke_test.py의 --shard와 함께 쓸 때는 서버
# 전체 코어 수를 (샤드 프로세스 수) × (elbow_n_jobs)로 나눠 잡아야
# 과다 점유(oversubscription)를 피한다 — 예: 8코어 서버라면
#   - --shard로 8개 프로세스 띄우고 elbow_n_jobs=1(기본값, 이 파일 그대로)
#   - --shard로 4개 프로세스 띄우고 elbow_n_jobs=2
#   - --shard 없이 프로세스 1개, elbow_n_jobs=5(K 후보 최대 개수)
# 중 서버 자원 상황에 맞는 조합을 고른다. --shard를 안 쓰고 Track B
# 콤보만 실행할 때(예: --track B) elbow_n_jobs를 늘리는 게 가장 안전하다.
