# 전역 하이퍼파라미터 — 모든 조합에 동일하게 적용한다 (PRD 10.1절).
# 조합별로 다르게 튜닝하지 않는다: 조합 간 성능 차이가 하이퍼파라미터가 아니라
# 컴포넌트 메커니즘 자체의 차이에서 비롯되도록 하기 위함.
#
# 유일한 예외: epochs_per_experience_track_b (아래 참고) — Track 단위(조합
# 단위가 아님)로만 다르다. Track A 내부끼리, Track B 내부끼리의 비교 공정성은
# 그대로 유지된다(Track A vs B는 PRD 5절/7절에 따라 애초에 "우열 비교" 대상이
# 아니므로 이 예외로 깨지는 원칙이 없다) — 실측으로 확인된 근거는 아래 주석.

optimizer: adam            # 테스트베드 기본값 (특정 논문 근거 아님)
learning_rate: 0.001        # 테스트베드 기본값
batch_size: 128             # 테스트베드 기본값
epochs_per_experience: 200
# Track A 기본값. 사용자 지시로 10 -> 200 상향(2026-07-28) — "학습이 너무
# 빨리 끝나는 것 같다"는 우려에 대응. Track A(SSF/CADE/GPM 등)는 이 값에서
# 실측으로 BWT가 0 근처(안정)임을 확인했다.

epochs_per_experience_track_b: 20
# Track B(CND-IDS) 전용 — CND-IDS 원 논문 실제 값(CND_IDS.py:13,144
# "train_epochs=20") 그대로. Track A와 같은 200을 그대로 적용했더니 실측으로
# catastrophic forgetting이 확인됐다(라운드별 F1이 0.906→0.824→...→0.75로
# 계속 하락, BWT -0.03~-0.04) — 원인은 CND-IDS의 망각방지 가중치
# `lambda_cl=0.1`이 SSF의 `lwf_lambda=0.5`보다 5배 약해서, 200에폭×lr=0.001
# 규모의 학습 강도를 못 버티기 때문(GPM은 gradient projection이라 학습
# 강도와 무관하게 항상 같은 세기로 보호되어 영향 없음). epoch=20(원 논문
# 값)으로 되돌리면 BWT가 거의 0으로 회복되고 F1도 0.90~0.92로 정상화됨을
# 실측으로 확인했다(사용자 지시). lr을 낮춰도 같은 효과가 있었지만(예:
# 0.0001), 그 값은 논문에 없는 임의의 수치라 채택하지 않았다 — epoch=20은
# 이미 검증된 원 논문 값이라 이쪽을 택했다. Track A/B는 서로 다른 문제를
# 푸는 트랙이라(PRD 5절/7절 — 우열이 아니라 트레이드오프) 트랙 간 에폭이
# 달라도 트랙 "내부" 비교의 공정성(이 프로젝트가 지키려는 핵심 원칙)은
# 전혀 깨지지 않는다 — Track B의 3개 조합은 전부 anti_forgetting=cndids로
# 고정이라 여전히 셋 다 동일한 20에폭을 받는다.
n_experiences: 5            # CND-IDS 원 논문 근거 — X-IIoTID/CICIDS2017(2018 아님)/
                            # UNSW-NB15를 5개 experience로 분할한다고 명시(CND-IDS
                            # utils.py 다수 위치에서 확인). CICIDS2018은 이 근거의
                            # 직접 대상이 아니지만, 그리드 전체에 동일 적용한다는
                            # 원칙에 따라 같은 값을 그대로 쓴다.
latent_dim: 64
hidden_dim: 256
# 사용자 지시로 (128,32) -> (256,64) 상향(2026-07-28). 임의로 2배가 아니라
# 근거가 있다 — SSF 원 논문 공식(utils.py:28-36)을 UNSW-NB15(196차원)에
# 적용하면 정확히 hidden=256/latent=64가 나온다(서브에이전트 조사로 확인,
# docs/metric_justification.md "SSF 원문 대조" 참고). NSL-KDD(121차원)
# 기준으로는 SSF 공식이 오히려 더 작은 hidden=64/latent=32를 요구하지만,
# 두 데이터셋에 동일 아키텍처를 강제해야 하는 이 테스트베드 제약상 "더 큰
# 쪽(UNSW-NB15)의 논문 공식값"을 공통 기본값으로 채택했다.
normal_reference_size: 500  # 12.6절 재보정 기준 샘플 수 (테스트베드 기본값)
seed: 42                    # 고정값. 복수 seed 반복 실행은 이 프로젝트 범위 밖 (6절)
