# 전역 하이퍼파라미터 — 63개 조합 전체에 동일하게 적용한다 (PRD 10.1절).
# 조합별로 다르게 튜닝하지 않는다: 조합 간 성능 차이가 하이퍼파라미터가 아니라
# 컴포넌트 메커니즘 자체의 차이에서 비롯되도록 하기 위함.

optimizer: adam            # 테스트베드 기본값 (특정 논문 근거 아님)
learning_rate: 0.001        # 테스트베드 기본값
batch_size: 128             # 테스트베드 기본값
epochs_per_experience: 200
# 사용자 지시로 10 -> 200 상향(2026-07-28) — "학습이 너무 빨리 끝나는 것
# 같다"는 우려에 대응, 각 논문이 실제로 쓰는 규모(SSF epochs=4+온라인
# epoch_1=1, CND-IDS train_epochs=20, SPIDER max_epochs=100)에 근접하도록
# 키웠다. GPU 환경(연구실 서버)에서 실행하는 것을 전제로 한 값이다 — 이
# 값으로 CPU에서 전체 그리드를 돌리면 20~40시간 규모로 추정된다(실측 기반
# 추정).
n_experiences: 5            # CND-IDS 원 논문 근거 — X-IIoTID/CICIDS2017/UNSW-NB15를
                            # 5개 experience로 분할한다고 명시 (CND-IDS utils.py 다수 위치에서 확인)
latent_dim: 64
hidden_dim: 256
# 사용자 지시로 (128,32) -> (256,64) 상향(2026-07-28). 임의로 2배가 아니라
# 근거가 있다 — SSF 원 논문 공식(utils.py:28-36)을 UNSW-NB15(196차원)에
# 적용하면 정확히 hidden=256/latent=64가 나온다(서브에이전트 조사로 확인,
# docs/metric_justification.md "SSF 원문 대조" 참고). NSL-KDD(121차원)
# 기준으로는 SSF 공식이 오히려 더 작은 hidden=64/latent=32를 요구하지만,
# 두 데이터셋에 동일 아키텍처를 강제해야 하는 이 테스트베드 제약상 "더 큰
# 쪽(UNSW-NB15)의 논문 공식값"을 공통 기본값으로 채택했다.
normal_reference_size: 500  # 12.6절 재보정 기준 샘플 수 (테스트베드 기본값)
seed: 42                    # 고정값. 복수 seed 반복 실행은 이 프로젝트 범위 밖 (6절)
