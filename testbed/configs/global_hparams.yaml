# 전역 하이퍼파라미터 — 모든 조합에 동일하게 적용한다 (PRD 10.1절).
# 조합별로 다르게 튜닝하지 않는다: 조합 간 성능 차이가 하이퍼파라미터가 아니라
# 컴포넌트 메커니즘 자체의 차이에서 비롯되도록 하기 위함.
#
# 예외: epochs_per_experience_track_b, batch_size_track_b (아래 각각 참고) —
# 둘 다 Track 단위(조합 단위가 아님)로만 다르다. Track A/B는 같은 평가지표
# (F1/Precision/Recall/PR-AUC/BWT, common/metrics.py)를 같은 프로토콜로
# 채점하므로 리더보드에서 함께 순위를 매긴다 — 다만 두 트랙은 각자 자기
# 근거 논문(SSF 계열 vs CND-IDS)의 실제 하이퍼파라미터를 그대로 쓰다 보니
# 학습 조건 자체가 다르다(Track A는 라벨 예산 안의 일부만, Track B는
# experience 전체를 라벨 없이 사용 — 아래 각 주석 참고). 이 비대칭은 감추지
# 않고 리더보드에 그대로 드러낸다 — 어느 조합이 실제로 최선인지 가리는 게
# 아니라 보여주는 것이 이 테스트베드의 목적이다. 실측/원 논문 근거는 아래
# 각 주석.

optimizer: adam            # 테스트베드 기본값 (특정 논문 근거 아님)
learning_rate: 0.001        # 테스트베드 기본값 (SSF bs와 별개로 CND-IDS
                            # Adam lr도 0.001 — CND_IDS.py:104, 우연히 일치)
batch_size: 128             # Track A 기본값. SSF 원 논문 실제 값(ssf.py:48
                            # "bs = 128") — Track A 아키텍처(hidden/latent dim)의
                            # 근거 논문과 같아 우연이 아니다.
epochs_per_experience: 200
# Track A 기본값. 사용자 지시로 10 -> 200 상향(2026-07-28) — "학습이 너무
# 빨리 끝나는 것 같다"는 우려에 대응. Track A(SSF/CADE/GPM 등)는 이 값에서
# 실측으로 BWT가 0 근처(안정)임을 확인했다.

epochs_per_experience_track_b: 20
# Track B(CND-IDS) 전용 — CND-IDS 원 논문 실제 값(CND_IDS.py:13,144
# "train_epochs=20") 그대로. Track A와 같은 200을 그대로 적용했더니 실측으로
# catastrophic forgetting이 확인됐다(라운드별 F1이 0.906→0.824→...→0.75로
# 계속 하락, BWT -0.03~-0.04) — 원인은 CND-IDS의 망각방지 가중치
# `lambda_cl=0.1`이 SSF의 `lwf_lambda=0.5`보다 5배 약해서, 200에폭×lr=0.001
# 규모의 학습 강도를 못 버티기 때문(GPM은 gradient projection이라 학습
# 강도와 무관하게 항상 같은 세기로 보호되어 영향 없음). epoch=20(원 논문
# 값)으로 되돌리면 BWT가 거의 0으로 회복되고 F1도 0.90~0.92로 정상화됨을
# 실측으로 확인했다(사용자 지시). lr을 낮춰도 같은 효과가 있었지만(예:
# 0.0001), 그 값은 논문에 없는 임의의 수치라 채택하지 않았다 — epoch=20은
# 이미 검증된 원 논문 값이라 이쪽을 택했다. Track A는 라벨 예산(10%) 안의
# 데이터만, Track B는 experience 전체를 라벨 없이 쓰므로 에폭 수가 달라도
# "같은 양의 정보"를 학습에 쓰는 게 아니다 — 이 비대칭은 각 트랙이 각자
# 근거 논문의 실제 값을 그대로 따른 결과이며, 리더보드에서 감추지 않는다
# (Track B의 6개 조합은 전부 anti_forgetting=cndids로 고정이라 적어도 트랙
# 내부에서는 전부 동일한 20에폭을 받아 공정하다).

batch_size_track_b: 64
# 2026-07-30 재검토로 추가: CND-IDS 원 논문 실제 값(CND_IDS.py:103
# "batch_size = 64") — Track A의 128(SSF 근거)과 다르다. epochs_per_experience_
# track_b와 같은 이유(각 트랙이 자기 근거 논문의 실제 값을 그대로 따름)로
# Track 단위 예외를 둔다.

# n_experiences는 더 이상 여기 고정값으로 두지 않는다(2026-09-03 결정, 예전 값
# 5는 CND-IDS 원 논문이 X-IIoTID/CICIDS2017(2018 아님)/UNSW-NB15를 5개
# experience로 나눈다는 근거를 "그리드 전체에 동일 적용한다"는 원칙으로
# NSL-KDD·CICIDS2018에까지 확장 적용한 것이었다). n_experiences가 데이터셋
# 간에 일치해야 할 필요가 없다는 게 확인됐다 — 리더보드가 데이터셋별로 완전히
# 분리되어 있어 데이터셋을 가로질러 비교하는 일 자체가 없기 때문이다
# (leaderboard_builder.py 참고). 반면 데이터셋 자신의 공격 유형 수와 라운드
# 수가 어긋나면(예전 NSL-KDD 4종/5라운드, CICIDS2018 14종/5라운드) 한 라운드에
# 여러 공격이 섞이거나 공격이 아예 없는 라운드가 생겨 category별 forgetting
# 지표가 흐려진다. 이제 `data/dataset_loader.py`의 `load_dataset()`이
# n_experiences=None(기본)일 때 데이터셋 자신의 실제 공격 category 수로
# 자동 결정한다("라운드 하나 = 새 공격 유형 하나") — `_count_attack_categories()`
# 참고. NSL-KDD 4라운드, UNSW-NB15/CICIDS2018은 실제 원본 category 수만큼.
# 2026-08-11 재검토: hidden_dim/latent_dim은 더 이상 여기 고정값으로 두지
# 않는다. SSF 원 논문(utils.py:32-36, nearest_pow2=2**round(log2(input_dim));
# hidden=nearest_pow2//2; latent=nearest_pow2//4)은 이 공식을 데이터셋을
# 로드할 때마다 매번 새로 계산한다(ssf.py:51-54,116-120) — 한 데이터셋에서
# 계산한 값을 고정 상수로 굳혀 다른 데이터셋에 강제하지 않는다. 이전 기록은
# "두 데이터셋에 동일 아키텍처를 강제해야 하니 더 큰 쪽(UNSW-NB15)의 값을
# 채택한다"는 절충이었는데, 이 절충 자체가 NSL-KDD엔 이미 틀린 값(공식대로면
# hidden=64/latent=32)이라는 걸 스스로 인정하고 있었고 CICIDS2018은 애초에
# 고려하지 않았다. 이제 `testbed/base/models.py`의 `ssf_backbone_dims(input_dim)`을
# `grid_runner.py`/`smoke_test.py`가 매 데이터셋마다 호출해 이 두 값을 그
# 자리에서 계산해 넣는다(모든 콤보·모든 컴포넌트가 동일 데이터셋에서는 동일
# 값을 공유 — cl_client.py가 이 값을 CADE 사설 encoder 등에도 동일하게
# 주입하므로 하나의 실행 안에서는 여전히 통일된 값이다).
# normal_reference_size는 2026-07-30에 제거했다 — 12.6절 재보정용 고정
# 참조 표본이라는 별도 개념 자체가 논문에 없었고(CADE 원 논문은 median/MAD를
# "그 시점 라벨이 있는 정상 데이터 전체"로 계산하는데, CADE에는 이 테스트베드
# 처럼 반복되는 라운드 개념 자체가 없어 "매 라운드 뭘 기준으로 재보정할지"는
# 애초에 답이 없는 질문이었다), 매 라운드 이미 라벨 예산(labeling_budget)
# 안에서 선택된 데이터 중 label=0인 것만 걸러 재보정 기준으로 쓰도록 바꿨다
# (pipeline/cl_client.py의 `normal_subset` 참고). 별도 파라미터가 필요 없고
# labeling_budget 비율에 자동으로 비례한다.
seed: 42                    # 고정값. 복수 seed 반복 실행은 이 프로젝트 범위 밖 (6절)

labeling_budget:
  mode: fixed_ratio
  value: 0.1
# 2026-07-30에 한 번 fixed_count=200(SSF ssf.py:23 "--num_labeled_sample"
# 기본값)으로 바꿨다가, 실측 회귀로 다시 되돌렸다 — SSF의 "200"은 이
# 테스트베드가 재현하지 않기로 이미 결정한 SSF만의 구조(매 라운드 계속
# 불어나는 누적 데이터셋 `x_train_this_epoch`, ssf.py:254)에 매 라운드
# "새로 추가되는 증분"이다. SSF는 NSL-KDD 기준 ~2.5만 개짜리 누적 풀로
# 시작해 거기에 200개씩만 보태며 그 풀 전체를 매번 재학습한다 — "200"이
# SSF에서 가리키는 실제 규모는 그 누적 풀 전체이지, 라운드당 학습에 쓰는
# 데이터 전체가 아니다. 이 테스트베드는 그 누적 구조를 쓰지 않으므로(PRD
# 13절 step 3~5 — new_batch/replay_batch 분리 구조, docs/metric_
# justification.md 참고), "200"을 라운드당 전체 학습 데이터 수로 그대로
# 적용하면 SSF의 실제 학습 규모(누적 풀, 수만 개)와 전혀 다른, 훨씬 더
# 작은 양이 된다. 실측 확인: 같은 조합(A_dd=none_ss=ssf_mm=none_af=none_
# as=cade_mad, NSL-KDD)에서 fixed_count=200은 f1=0.236(6초),
# fixed_ratio=0.1은 f1=0.675(33초) — SSFSampleSelector가 라운드 데이터의
# 극히 일부(수백 개)만 뽑아야 할 때 KL-마스크 기반 선택이 균등 목표
# 분포를 맞추려다 오히려 희귀 구간(극단값)에 편중된 비대표 표본을 뽑는
# 부작용까지 겹쳐, ss=random은 별문제 없는데 ss=ssf만 유독 심하게
# 무너지는 것까지 확인했다. fixed_ratio=0.1은 특정 논문 수치는 아니지만
# (이미 scenario_design_notes.md에 명시), 이 테스트베드 자체의 구조에서
# 라운드 데이터 규모에 비례해 안정적으로 작동하는 값이다.
