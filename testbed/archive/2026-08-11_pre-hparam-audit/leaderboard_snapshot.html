  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root { min-height: 100vh; padding: 24px 20px 60px; }
  .wrap { max-width: 1100px; margin: 0 auto; }

  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 4px; line-height: 1.6; }
  .caveat { color: var(--text-muted); font-size: 12px; margin: 0 0 20px; line-height: 1.6; }

  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--gridline); }
  .tab-btn {
    font: inherit; font-size: 14px; padding: 10px 16px; border: none; background: none;
    color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--series-a); font-weight: 600; }

  .panel { display: none; }
  .panel.active { display: block; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .stat-combo { font-size: 12px; color: var(--text-secondary); word-break: break-all; margin-bottom: 8px; line-height: 1.4; font-family: ui-monospace, monospace; }
  .stat-metrics { font-size: 13px; font-variant-numeric: tabular-nums; }
  .stat-metrics b { font-size: 17px; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 28px 0 10px; }

  .chart-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 16px 8px; margin-bottom: 8px;
  }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

  svg.barchart { width: 100%; display: block; overflow: visible; }
  .bar-label { font-size: 12.5px; fill: var(--text-secondary); font-family: ui-monospace, monospace; }
  .bar-value { font-size: 12.5px; fill: var(--text-primary); font-variant-numeric: tabular-nums; }
  .combo-label { font-size: 14px; font-weight: 700; fill: var(--text-primary); font-family: system-ui, -apple-system, sans-serif; }
  .axis-title { font-size: 13px; fill: var(--text-secondary); font-family: system-ui, -apple-system, sans-serif; }
  .scatter-point { cursor: pointer; fill-opacity: 0.75; stroke-width: 1.5; stroke: var(--surface-1); }
  .bar-rect { cursor: pointer; }
  .bar-axis-line { stroke: var(--baseline); stroke-width: 1; }
  .bar-grid-line { stroke: var(--gridline); stroke-width: 1; }

  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .controls input[type="text"] {
    font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    min-width: 220px;
  }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; padding: 6px 12px; border: none; background: var(--surface-1);
    color: var(--text-secondary); cursor: pointer; border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--series-a); color: white; }
  .row-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--surface-1); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; padding: 9px 10px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--text-muted); border-bottom: 1px solid var(--gridline);
    cursor: pointer; white-space: nowrap; user-select: none;
  }
  thead th:hover { color: var(--text-primary); }
  thead th.sorted { color: var(--text-primary); }
  tbody td { padding: 7px 10px; border-bottom: 1px solid var(--gridline); white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody td.combo-id { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--text-secondary); white-space: normal; word-break: break-all; max-width: 320px; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.top3 { background: var(--row-top); }
  .track-badge {
    display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; color: white;
  }
  .track-a { background: var(--series-a); }
  .track-b { background: var(--series-b); }

  .tooltip {
    position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);

function fmt(n, d=4) { return (typeof n === "number") ? n.toFixed(d) : n; }

function buildTabs() {
  const tabsEl = document.getElementById("tabs");
  DATASETS.forEach(ds => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (ds === activeTab ? " active" : "");
    btn.textContent = DATASET_LABELS[ds];
    btn.onclick = () => { activeTab = ds; render(); };
    btn.dataset.ds = ds;
    tabsEl.appendChild(btn);
  });
}

function topByTrack(rows, track) {

  return f.length ? f[0] : null;
}

function renderStats(container, rows) {
  const overall = rows[0];
  const a = topByTrack(rows, "A");
  const b = topByTrack(rows, "B");
  const tiles = [
    { label: "전체 1위", row: overall },
    { label: "Track A 1위", row: a },
    { label: "Track B 1위", row: b },
  ];
  const statsRow = document.createElement("div");
  statsRow.className = "stats-row";
  tiles.forEach(t => {
    const tile = document.createElement("div");
    tile.className = "stat-tile";
    if (!t.row) {
      tile.innerHTML = `<div class="stat-label">${t.label}</div><div class="stat-combo">해당 없음</div>`;
    } else {
      tile.innerHTML = `
        <div class="stat-label">${t.label}</div>
        <div class="stat-combo">${t.row.combo_id}</div>
        <div class="stat-metrics">F1 <b>${fmt(t.row.f1)}</b> &nbsp; PR-AUC ${fmt(t.row.pr_auc)}</div>`;
    }
    statsRow.appendChild(tile);
  });
  container.appendChild(statsRow);
}

function renderBarChart(container, rows) {
  const top = rows.slice(0, 15);
  const card = document.createElement("div");
  card.className = "chart-card";

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = `
    <div class="legend-item"><span class="legend-swatch" style="background:var(--series-a)"></span>Track A</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--series-b)"></span>Track B</div>`;
  card.appendChild(legend);

  const title = document.createElement("div");
  title.className = "section-title";
  title.style.margin = "0 0 8px";
  title.textContent = "상위 15개 조합 (F1 기준)";
  card.appendChild(title);

  const W = 1000, rowH = 26, padTop = 4, padBottom = 4, leftW = 340, rightPad = 60;
  const chartW = W - leftW - rightPad;
  const H = top.length * rowH + padTop + padBottom;

  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns, "svg");
  svg.setAttribute("class", "barchart");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // gridlines at 0, 0.25, 0.5, 0.75, 1.0
  [0, 0.25, 0.5, 0.75, 1.0].forEach(g => {
    const x = leftW + g * chartW;
    const line = document.createElementNS(svgns, "line");
    line.setAttribute("x1", x); line.setAttribute("x2", x);
    line.setAttribute("y1", padTop); line.setAttribute("y2", H - padBottom);
    line.setAttribute("class", "bar-grid-line");
    svg.appendChild(line);
  });

  top.forEach((row, i) => {
    const y = padTop + i * rowH;
    const barH = 14;
    const barY = y + (rowH - barH) / 2;
    const barW = Math.max(2, row.f1 * chartW);
    const color = row.track === "A" ? "var(--series-a)" : "var(--series-b)";

    const label = document.createElementNS(svgns, "text");
    label.setAttribute("x", leftW - 10);
    label.setAttribute("y", y + rowH / 2 + 4);
    label.setAttribute("text-anchor", "end");
    label.setAttribute("class", "bar-label");
    label.textContent = row.combo_id.length > 46 ? row.combo_id.slice(0, 44) + "…" : row.combo_id;
    svg.appendChild(label);

    const rect = document.createElementNS(svgns, "rect");
    rect.setAttribute("x", leftW);
    rect.setAttribute("y", barY);
    rect.setAttribute("width", barW);
    rect.setAttribute("height", barH);
    rect.setAttribute("rx", 4);
    rect.setAttribute("fill", color);
    rect.setAttribute("class", "bar-rect");
    rect.addEventListener("mousemove", (e) => showTooltip(e, row));
    rect.addEventListener("mouseleave", hideTooltip);
    svg.appendChild(rect);

    const val = document.createElementNS(svgns, "text");
    val.setAttribute("x", leftW + barW + 8);
    val.setAttribute("y", y + rowH / 2 + 4);
    val.setAttribute("class", "bar-value");
    val.textContent = fmt(row.f1, 3);
    svg.appendChild(val);
  });

  const axis = document.createElementNS(svgns, "line");
  axis.setAttribute("x1", leftW); axis.setAttribute("x2", leftW);
  axis.setAttribute("y1", padTop); axis.setAttribute("y2", H - padBottom);
  axis.setAttribute("class", "bar-axis-line");
  svg.appendChild(axis);

  card.appendChild(svg);
  container.appendChild(card);
}

const METRICS = [
  { key: "precision", label: "Precision", varName: "--metric-precision" },
  { key: "recall",    label: "Recall",    varName: "--metric-recall" },
  { key: "f1",        label: "F1",        varName: "--metric-f1" },
  { key: "pr_auc",    label: "PR-AUC",    varName: "--metric-prauc" },
];

function renderGroupedMetricChart(container, rows) {
  const top5 = rows.slice(0, 5);
  const card = document.createElement("div");
  card.className = "chart-card";

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = METRICS.map(m =>
    `<div class="legend-item"><span class="legend-swatch" style="background:var(${m.varName})"></span>${m.label}</div>`
  ).join("");
  card.appendChild(legend);

  const title = document.createElement("div");
  title.className = "section-title";
  title.style.margin = "0 0 8px";
  title.textContent = "상위 5개 조합 - Precision / Recall / F1 / PR-AUC";
  card.appendChild(title);

  const W = 1000, plotH = 260, marginTop = 10, marginBottom = 36, marginLeft = 36, marginRight = 10;
  const H = marginTop + plotH + marginBottom;
  const plotW = W - marginLeft - marginRight;
  const groupW = plotW / top5.length;
  const barGap = 4;
  const barW = (groupW - barGap * (METRICS.length + 1)) / METRICS.length;

  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns, "svg");
  svg.setAttribute("class", "barchart");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  [0, 0.25, 0.5, 0.75, 1.0].forEach(g => {
    const y = marginTop + (1 - g) * plotH;
    const line = document.createElementNS(svgns, "line");
    line.setAttribute("x1", marginLeft); line.setAttribute("x2", marginLeft + plotW);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    line.setAttribute("class", "bar-grid-line");
    svg.appendChild(line);
    const tick = document.createElementNS(svgns, "text");
    tick.setAttribute("x", marginLeft - 6);
    tick.setAttribute("y", y + 3);
    tick.setAttribute("text-anchor", "end");
    tick.setAttribute("class", "bar-label");
    tick.textContent = g.toFixed(2);
    svg.appendChild(tick);
  });

  top5.forEach((row, gi) => {
    const gx = marginLeft + gi * groupW;

    METRICS.forEach((m, mi) => {
      const val = row[m.key];
      const bx = gx + barGap + mi * (barW + barGap);
      const bh = Math.max(1, val * plotH);
      const by = marginTop + plotH - bh;

      const rect = document.createElementNS(svgns, "rect");
      rect.setAttribute("x", bx);
      rect.setAttribute("y", by);
      rect.setAttribute("width", barW);
      rect.setAttribute("height", bh);
      rect.setAttribute("rx", 3);
      rect.setAttribute("fill", `var(${m.varName})`);
      rect.setAttribute("class", "bar-rect");
      rect.addEventListener("mousemove", (e) => showTooltip(e, row));
      rect.addEventListener("mouseleave", hideTooltip);
      svg.appendChild(rect);
    });

    const rankLabel = document.createElementNS(svgns, "text");
    rankLabel.setAttribute("x", gx + groupW / 2);
    rankLabel.setAttribute("y", marginTop + plotH + 24);
    rankLabel.setAttribute("text-anchor", "middle");
    rankLabel.setAttribute("class", "combo-label");
    rankLabel.textContent = "#" + (gi + 1) + " · Track " + row.track;
    rankLabel.style.cursor = "pointer";
    rankLabel.addEventListener("mousemove", (e) => showTooltip(e, row));
    rankLabel.addEventListener("mouseleave", hideTooltip);
    svg.appendChild(rankLabel);
  });

  const axis = document.createElementNS(svgns, "line");
  axis.setAttribute("x1", marginLeft); axis.setAttribute("x2", marginLeft);
  axis.setAttribute("y1", marginTop); axis.setAttribute("y2", marginTop + plotH);
  axis.setAttribute("class", "bar-axis-line");
  svg.appendChild(axis);
  const baseline = document.createElementNS(svgns, "line");
  baseline.setAttribute("x1", marginLeft); baseline.setAttribute("x2", marginLeft + plotW);
  baseline.setAttribute("y1", marginTop + plotH); baseline.setAttribute("y2", marginTop + plotH);
  baseline.setAttribute("class", "bar-axis-line");
  svg.appendChild(baseline);

  card.appendChild(svg);
  container.appendChild(card);
}

function renderScatterChart(container, rows) {
  const card = document.createElement("div");
  card.className = "chart-card";

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = `
    <div class="legend-item"><span class="legend-swatch" style="background:var(--series-a)"></span>Track A</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--series-b)"></span>Track B</div>`;
  card.appendChild(legend);

  const title = document.createElement("div");
  title.className = "section-title";
  title.style.margin = "0 0 8px";
  title.textContent = `전체 ${rows.length}개 조합 - Precision vs Recall`;
  card.appendChild(title);

  const marginLeft = 60, marginRight = 20, marginTop = 15, marginBottom = 50;
  const plotSide = 620;
  const W = marginLeft + plotSide + marginRight;
  const H = marginTop + plotSide + marginBottom;

  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns, "svg");
  svg.setAttribute("class", "barchart");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const ticks = [0, 0.25, 0.5, 0.75, 1.0];
  ticks.forEach(t => {
    const x = marginLeft + t * plotSide;
    const y = marginTop + (1 - t) * plotSide;

    const vLine = document.createElementNS(svgns, "line");
    vLine.setAttribute("x1", x); vLine.setAttribute("x2", x);
    vLine.setAttribute("y1", marginTop); vLine.setAttribute("y2", marginTop + plotSide);
    vLine.setAttribute("class", "bar-grid-line");
    svg.appendChild(vLine);

    const hLine = document.createElementNS(svgns, "line");
    hLine.setAttribute("x1", marginLeft); hLine.setAttribute("x2", marginLeft + plotSide);
    hLine.setAttribute("y1", y); hLine.setAttribute("y2", y);
    hLine.setAttribute("class", "bar-grid-line");
    svg.appendChild(hLine);

    const xTick = document.createElementNS(svgns, "text");
    xTick.setAttribute("x", x);
    xTick.setAttribute("y", marginTop + plotSide + 20);
    xTick.setAttribute("text-anchor", "middle");
    xTick.setAttribute("class", "bar-label");
    xTick.textContent = t.toFixed(2);
    svg.appendChild(xTick);

    const yTick = document.createElementNS(svgns, "text");
    yTick.setAttribute("x", marginLeft - 10);
    yTick.setAttribute("y", y + 4);
    yTick.setAttribute("text-anchor", "end");
    yTick.setAttribute("class", "bar-label");
    yTick.textContent = t.toFixed(2);
    svg.appendChild(yTick);
  });

  const xAxisLabel = document.createElementNS(svgns, "text");
  xAxisLabel.setAttribute("x", marginLeft + plotSide / 2);
  xAxisLabel.setAttribute("y", H - 8);
  xAxisLabel.setAttribute("text-anchor", "middle");
  xAxisLabel.setAttribute("class", "axis-title");
  xAxisLabel.textContent = "Recall";
  svg.appendChild(xAxisLabel);

  const yAxisLabel = document.createElementNS(svgns, "text");
  yAxisLabel.setAttribute("x", -(marginTop + plotSide / 2));
  yAxisLabel.setAttribute("y", 16);
  yAxisLabel.setAttribute("text-anchor", "middle");
  yAxisLabel.setAttribute("class", "axis-title");
  yAxisLabel.setAttribute("transform", "rotate(-90)");
  svg.appendChild(yAxisLabel);
  yAxisLabel.textContent = "Precision";

  const xAxis = document.createElementNS(svgns, "line");
  xAxis.setAttribute("x1", marginLeft); xAxis.setAttribute("x2", marginLeft + plotSide);
  xAxis.setAttribute("y1", marginTop + plotSide); xAxis.setAttribute("y2", marginTop + plotSide);
  xAxis.setAttribute("class", "bar-axis-line");
  svg.appendChild(xAxis);
  const yAxis = document.createElementNS(svgns, "line");
  yAxis.setAttribute("x1", marginLeft); yAxis.setAttribute("x2", marginLeft);
  yAxis.setAttribute("y1", marginTop); yAxis.setAttribute("y2", marginTop + plotSide);
  yAxis.setAttribute("class", "bar-axis-line");
  svg.appendChild(yAxis);

  // Track A를 먼저 그리고 Track B(3개뿐)를 나중에 그려서, 점이 겹칠 때
  // 수가 적은 Track B가 가려지지 않도록 한다.
  const ordered = rows.slice().sort((a, b) => (a.track === b.track) ? 0 : (a.track === "B" ? 1 : -1));
  ordered.forEach(row => {
    const cx = marginLeft + row.recall * plotSide;
    const cy = marginTop + (1 - row.precision) * plotSide;
    const circle = document.createElementNS(svgns, "circle");
    circle.setAttribute("cx", cx);
    circle.setAttribute("cy", cy);
    circle.setAttribute("r", 5.5);
    circle.setAttribute("fill", row.track === "A" ? "var(--series-a)" : "var(--series-b)");
    circle.setAttribute("class", "scatter-point");
    circle.addEventListener("mousemove", (e) => showTooltip(e, row));
    circle.addEventListener("mouseleave", hideTooltip);
    svg.appendChild(circle);
  });

  card.appendChild(svg);
  container.appendChild(card);
}

function showTooltip(e, row) {
  const tip = document.getElementById("tooltip");
  tip.innerHTML = `
    <div class="t-combo">${row.combo_id}</div>
    F1 <b>${fmt(row.f1)}</b> · Precision ${fmt(row.precision)} · Recall ${fmt(row.recall)}<br>
    PR-AUC ${fmt(row.pr_auc)} · BWT ${fmt(row.bwt)}`;
  tip.style.display = "block";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY + 14) + "px";
}
function hideTooltip() { document.getElementById("tooltip").style.display = "none"; }

function renderControls(container, ds) {
  const s = state[ds];
  const row = document.createElement("div");
  row.className = "controls";

  const seg = document.createElement("div");
  seg.className = "seg";
  ["all", "A", "B"].forEach(v => {
    const b = document.createElement("button");
    b.textContent = v === "all" ? "전체" : "Track " + v;
    b.className = s.trackFilter === v ? "active" : "";
    b.onclick = () => {
      s.trackFilter = v;
      if (v === "all") { s.sortCol = "f1"; s.sortDir = -1; }
      render();
    };
    seg.appendChild(b);
  });
  row.appendChild(seg);

  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "combo_id 검색 (예: gpm, cade_mad, ssf)";
  input.value = s.search;
  input.oninput = (e) => { s.search = e.target.value; renderTableOnly(ds); };
  row.appendChild(input);

  const count = document.createElement("div");
  count.className = "row-count";
  count.id = "row-count-" + ds;
  row.appendChild(count);
  rowCountEls[ds] = count;

  container.appendChild(row);
}

function filteredSorted(ds) {
  const s = state[ds];
  let rows = DATA[ds].slice();
  if (s.trackFilter !== "all") rows = rows.filter(r => r.track === s.trackFilter);
  if (s.search.trim()) {
    const q = s.search.trim().toLowerCase();
    rows = rows.filter(r => r.combo_id.toLowerCase().includes(q));
  }
  rows.sort((a, b) => {
    const av = a[s.sortCol], bv = b[s.sortCol];
    if (NUMERIC_COLS.has(s.sortCol)) return (av - bv) * s.sortDir;
    return String(av).localeCompare(String(bv)) * s.sortDir;
  });
  return rows;
}

function renderTable(container, ds) {
  const tableWrap = document.createElement("div");
  tableWrap.className = "scroll-x";
  tableWrap.id = "table-wrap-" + ds;
  container.appendChild(tableWrap);
  tableWrapEls[ds] = tableWrap;
  renderTableOnly(ds);
}

function renderTableOnly(ds) {
  const wrap = tableWrapEls[ds];
  if (!wrap) return;
  const s = state[ds];
  const rows = filteredSorted(ds);
  rowCountEls[ds].textContent = rows.length + " / " + DATA[ds].length + "개 조합";

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  COLS.forEach(c => {
    const th = document.createElement("th");
    th.textContent = COL_LABELS[c] + (s.sortCol === c ? (s.sortDir === -1 ? " ▼" : " ▲") : "");
    if (s.sortCol === c) th.classList.add("sorted");
    th.onclick = () => {
      if (s.sortCol === c) s.sortDir *= -1;
      else { s.sortCol = c; s.sortDir = NUMERIC_COLS.has(c) ? -1 : 1; }
      renderTableOnly(ds);
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  rows.forEach((row, i) => {
    const tr = document.createElement("tr");
    if (i < 3 && s.sortCol === "f1" && s.sortDir === -1) tr.classList.add("top3");
    COLS.forEach(c => {
      const td = document.createElement("td");
      if (c === "combo_id") { td.className = "combo-id"; td.textContent = row[c]; }
      else if (c === "track") { td.innerHTML = `<span class="track-badge track-${row[c].toLowerCase()}">${row[c]}</span>`; }
      else if (NUMERIC_COLS.has(c)) { td.textContent = fmt(row[c]); }
      else { td.textContent = row[c]; }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  wrap.innerHTML = "";
  wrap.appendChild(table);
}

function render() {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.ds === activeTab));
  const panels = document.getElementById("panels");
  panels.innerHTML = "";
  const panel = document.createElement("div");
  panel.className = "panel active";

  const rowsSortedByF1 = DATA[activeTab].slice().sort((a, b) => b.f1 - a.f1 || b.pr_auc - a.pr_auc);
  renderStats(panel, rowsSortedByF1);
  renderGroupedMetricChart(panel, rowsSortedByF1);
  renderBarChart(panel, rowsSortedByF1);
  renderScatterChart(panel, rowsSortedByF1);

  const tableTitle = document.createElement("div");
  tableTitle.className = "section-title";
  tableTitle.textContent = "전체 조합 (" + DATA[activeTab].length + "개)";
  panel.appendChild(tableTitle);

  renderControls(panel, activeTab);
  renderTable(panel, activeTab);

  panels.appendChild(panel);
}

buildTabs();
render();
</script>
